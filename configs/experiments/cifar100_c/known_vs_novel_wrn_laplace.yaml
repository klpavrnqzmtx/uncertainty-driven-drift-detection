# CIFAR-100-C known-vs-novel — wrn (laplace).
experiment: cifar100_kn_wrn_laplace
seed: 42
output_dir: ./results/raw

dataset:
  name: cifar100_known_novel
  params:
    # gaussian_noise and motion_blur are dropped from the STREAM: at severity 3 they
    # dominate the known-phase error (RMSE 0.165 / 0.102 vs ~0.03-0.07 for the rest),
    # which buries the known-vs-novel contrast. They stay in train_corruptions below,
    # so the five shown here are still corruptions the model was trained on.
    known_corruptions: [shot_noise, zoom_blur, brightness, contrast, jpeg_compression]
    novel_corruptions:  [impulse_noise, defocus_blur, pixelate]
    n_batches_per_phase: 20
    severity: 3
    batch_size: 64
    seed: 0
    data_root: ./artifacts/cifar100

model:
  name: wrn2810_laplace
  params:
    data_root: ./artifacts/cifar100
    # v4: retrained under the recipe below. MEASURED 12 Sep: the recipe is a
    # NO-OP -- v3 scores clean 0.760 / known-corruption 0.683 and v4 0.753 /
    # 0.676 under identical evaluation, i.e. v3 is marginally better. Do not
    # describe this as a fix. ~0.68 on corruption-augmented CIFAR-100 is simply
    # where WRN-28-10 lands (literature clean is ~0.80; 80% of training batches
    # here are corrupted). The earlier "~90%" comparison was wrong: that was
    # CIFAR-10 for ResNet-20 and a pretrained ViT for the other arm.
    # The recipe knobs below (step schedule + warmup + Nesterov + grad clip,
    # block_drop 0.1, label smoothing) are retained because v4 is the trained
    # checkpoint on disk, not because they help. Reverting to v3 would be
    # equally defensible.
    ckpt_path: ./artifacts/models/wrn2810_cifar100_v4_laplace.pt
    # Unchanged (all 7): the backbone stays trained on gaussian_noise/motion_blur,
    # so no retrain is needed — they are simply not streamed.
    train_corruptions: [gaussian_noise, shot_noise, motion_blur, zoom_blur, brightness, contrast, jpeg_compression]
    corruption_severity: 3
    clean_fraction: 0.2
    pretrain_epochs: 160
    pretrain_batch_size: 128
    pretrain_lr: 0.1
    pretrain_seed: 0
    lr_schedule: step        # step-decay (paper recipe) instead of cosine — see rationale above
    warmup_epochs: 5
    nesterov: true
    grad_clip: 5.0
    label_smoothing: 0.1     # curbs overconfidence so the Laplace posterior stays informative
    n_samples: 20
    prior_precision: 1.0
    seed: 0

uncertainty:
  name: mc_dropout
  params: {}

detectors:
  - name: ddm
    params: {warm_start: 200, drift_threshold: 2.5}
  - name: eddm
    params: {alpha: 0.95, warm_start: 300, beta: 0.95}
  - name: page_hinkley
    params: {signal: mean_epistemic, name: ph_epistemic, threshold: 0.206032, delta: 0.051508, min_instances: 10.0}
  - name: kswin
    params: {signal: mean_epistemic, name: kswin_epistemic, alpha: 0.1, window_size: 20, stat_size: 8}
  - name: adwin
    params: {signal: mean_epistemic, name: adwin_epistemic, delta: 0.001}
  - name: page_hinkley
    params: {signal: mean_total, name: ph_total, threshold: 0.196969, delta: 0.098484, min_instances: 10.0}
  - name: kswin
    params: {signal: mean_total, name: kswin_total, alpha: 0.05, window_size: 20, stat_size: 8}
  - name: adwin
    params: {signal: mean_total, name: adwin_total, delta: 0.3}
  - name: page_hinkley
    params: {signal: mean_input, name: ph_input, threshold: 0.057058, delta: 0.028529, min_instances: 5.0}
  - name: kswin
    params: {signal: mean_input, name: kswin_input, alpha: 0.1, window_size: 20, stat_size: 8}
  - name: adwin
    params: {signal: mean_input, name: adwin_input, delta: 0.0001}
