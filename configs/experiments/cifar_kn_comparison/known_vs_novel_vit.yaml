# CIFAR-10 Known-vs-Novel experiment — MC-Dropout ViT
#
# Architecture arm of the known-vs-novel comparison. Everything except the
# backbone is held fixed against known_vs_novel.yaml (ResNet-20): same stream,
# same seed, same corruption split, same uncertainty estimator, same detectors.
#
# Model: CIFAR-scale ViT (patch 4 → 8×8=64 tokens, dim 192, depth 6, 3 heads,
#        ~1.8M params) trained FROM SCRATCH — not ImageNet-pretrained, so the
#        only variable moving vs the ResNet arm is the architecture itself.
#        Same known-corruption augmentation (clean_fraction=0.25, severity 1).
#        AdamW lr 1e-3 / wd 0.05 / 10-epoch warmup into cosine, label smoothing
#        0.1, 200 epochs — ViTs diverge under the ResNet's SGD lr=0.1 schedule
#        and converge more slowly, hence the longer budget.
#
# NOTE ON DETECTOR THRESHOLDS: the page_hinkley `delta`/`threshold` values below
# are copied from the ResNet arm, where they were swept against *that* model's
# epistemic scale. A different backbone puts the epistemic signal on a different
# scale, so re-sweep before reading anything into PH's operating point:
#   python scripts/sweep_detectors.py \
#       --config configs/experiments/cifar_kn_comparison/known_vs_novel_vit.yaml
# ADWIN's delta and KSWIN's alpha are scale-free and port as-is.

experiment: cifar_kn_comparison_vit
seed: 42
output_dir: ./results/raw

dataset:
  name: cifar_known_novel
  params:
    known_corruptions:
      - brightness
      - contrast
      - jpeg_compression
      - shot_noise
      - zoom_blur
      - impulse_noise
      - fog
    novel_corruptions:
      - glass_blur
      - elastic_transform
      - frost
    n_batches_per_phase: 20
    severity: 1
    batch_size: 64
    seed: 7
    data_root: ./artifacts/cifar10

model:
  name: vit_mc_dropout
  params:
    n_samples: 20
    p_drop: 0.1
    dataset_name: cifar10
    data_root: ./artifacts/cifar10
    ckpt_path: ./artifacts/models/vit_cifar_kn_mc.pt
    # Backbone geometry (CIFAR-scale, not a downscaled ImageNet ViT).
    patch_size: 4
    dim: 192
    depth: 6
    n_heads: 3
    mlp_ratio: 2.0
    # Known-corruption augmentation — identical to the ResNet arm.
    train_corruptions:
      - brightness
      - contrast
      - jpeg_compression
      - shot_noise
      - zoom_blur
      - impulse_noise
      - fog
    corruption_severity: 1
    clean_fraction: 0.25
    pretrain_epochs: 200
    pretrain_batch_size: 128
    pretrain_lr: 0.001
    pretrain_weight_decay: 0.05
    pretrain_warmup_epochs: 10
    label_smoothing: 0.1
    pretrain_seed: 0
    seed: 1

uncertainty:
  name: mc_dropout
  params: {}

detectors:
  # ── Supervised ────────────────────────────────────────────────────────────
  - name: ddm
    params: {warm_start: 200, drift_threshold: 2.5}

  - name: eddm
    params: {alpha: 0.95, warm_start: 300, beta: 0.95}

  # ── Uncertainty-based (epistemic MI) ──────────────────────────────────────
  - name: adwin
    params: {signal: mean_epistemic, name: adwin_epistemic, delta: 0.3}

  - name: kswin
    params: {signal: mean_epistemic, name: kswin_epistemic, alpha: 0.05, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.006971, signal: mean_epistemic, name: ph_epistemic, threshold: 0.027884, min_instances: 10.0}

  # ── Total predictive entropy (the UDD baseline) ────────────────────────────
  # Added so the panel can show our signal against the baseline it is compared
  # to. These runs previously logged mean_total as a COLUMN but never ran a
  # detector on it, so the figure had no total-entropy row to draw.
  - name: adwin
    params: {signal: mean_total, name: adwin_total, delta: 0.1}

  - name: kswin
    params: {signal: mean_total, name: kswin_total, alpha: 0.1, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.023934, signal: mean_total, name: ph_total, threshold: 0.095736, min_instances: 10.0}

  # ── Input-based (model-free P(X) drift; same 3 algorithms) ────────────────
  # Identical to the ResNet arm by construction: mean_input is computed from raw
  # pixels, so it does not depend on the backbone at all. Any difference between
  # the two arms' input rows would be a bug.
  - name: adwin
    params: {signal: mean_input, name: adwin_input, delta: 0.3}

  - name: kswin
    params: {signal: mean_input, name: kswin_input, alpha: 0.2, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.018675, signal: mean_input, name: ph_input, threshold: 0.037349, min_instances: 5.0}
