# ESC-50 Known-vs-Novel — MC-Dropout ResNet-18 on log-mel (deployment-scale control)
#
# Third capacity point on the same stream, same corruptions, same severities:
#
#   247 K   esc50_known_vs_novel.yaml            (matched to the image ResNet-20)
#   1.58 M  esc50_known_vs_novel_wide.yaml       (6.4x)
#   11.2 M  this file                            (45x)
#
# ResNet-18 over log-mel is the standard audio-classification baseline — the
# backbone family PANNs and most ESC-50 / UrbanSound8K papers report — so this is
# the arm that answers "does the finding hold at a size someone would deploy?".
# The 247 K default cannot answer that: it is deliberately sized to match the
# image arms' ResNet-20 so a modality difference is not a capacity difference,
# which is the right control for a different question.
#
# NOT pretrained, on purpose. "Epistemically familiar" is defined relative to the
# training set; an ImageNet- or AudioSet-pretrained backbone has already seen a
# vast range of acoustic conditions, which weakens the notion of a novel
# corruption. This is the same reason the image side has a from-scratch ViT arm.
#
# Expect overfitting: 1,200 training clips against 11.2 M parameters. If
# known-phase accuracy comes out at or below the 247 K model's 0.664, that is the
# small-data regime, not a bug, and it is exactly why ESC-50 papers reporting
# ~95% use pretrained backbones.

experiment: audio_kn_esc50_resnet18
seed: 42
output_dir: ./results/raw

dataset:
  name: audio_known_novel
  params:
    dataset: esc50
    split: val+test
    # KNOWN PHASE IS A LEVEL-MATCHED SUBSET of train_corruptions.
    #
    # band_stop is still in train_corruptions below -- the backbone knows it -- but
    # it is NOT streamed. Reason, measured on the TRAIN split with
    # scripts/probe_corruptions.py (a split no stream draws from, so the choice is
    # not circular): at severity 3 band_stop sits far above the other known
    # corruptions in epistemic level (+0.120 vs +0.006..+0.048 on ESC-50; +0.057 vs
    # +0.004..+0.027 on UrbanSound8K; +0.047 vs -0.002..+0.022 on Speech Commands).
    # Streaming it put a real ~2.5 sigma level step inside the "known" phase, and
    # every change detector fired at its block edges -- correctly, but the run then
    # reported those as known-phase false alarms.
    #
    # Dropping it from the stream makes the known phase approximately stationary,
    # which is what "in-distribution operation" is supposed to mean, and needs no
    # retraining because the model still trained on it.
    #
    # Disclosed limitation: the retained known corruptions are on average EASIER
    # than the novel three, so difficulty and novelty are entangled here as they
    # are in any such design. The primary justification for the known/novel split
    # remains mechanism (transient clicks, temporal gating, spectral warping are
    # not producible by stationary noise, filtering, quantisation or reverb);
    # level-matching is a secondary refinement for legibility.
    known_corruptions:
      - gaussian_noise
      - pink_noise
      - hum_noise
      - lowpass
      - quantization
      - reverb
    novel_corruptions:
      - impulse_noise
      - packet_loss
      - pitch_shift
    n_batches_per_phase: 20
    severity: 3
    batch_size: 64
    seed: 7
    data_root: ./artifacts/audio/esc50

model:
  name: audio_cnn_mc_dropout
  params:
    arch: resnet18
    n_samples: 20
    p_drop: 0.3
    dataset: esc50
    data_root: ./artifacts/audio/esc50
    ckpt_path: ./artifacts/models/audio_resnet18_esc50_kn_mc.pt
    train_corruptions:
      - gaussian_noise
      - pink_noise
      - hum_noise
      - lowpass
      - band_stop
      - quantization
      - reverb
    corruption_severity: 3
    clean_fraction: 0.25
    pretrain_epochs: 120
    pretrain_batch_size: 128
    pretrain_lr: 0.05
    pretrain_seed: 0
    seed: 1

uncertainty:
  name: mc_dropout
  params: {}

detectors:
  - name: ddm
    params: {warm_start: 200, drift_threshold: 2.0}
  - name: eddm
    params: {alpha: 0.95, warm_start: 300, beta: 0.9}
  - name: adwin
    params: {signal: mean_epistemic, name: adwin_epistemic, delta: 0.3}
  - name: kswin
    params: {signal: mean_epistemic, name: kswin_epistemic, alpha: 0.2, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.006561, signal: mean_epistemic, name: ph_epistemic, threshold: 0.026245, min_instances: 10.0}
  - name: adwin
    params: {signal: mean_total, name: adwin_total, delta: 0.01}
  - name: kswin
    params: {signal: mean_total, name: kswin_total, alpha: 0.2, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.043529, signal: mean_total, name: ph_total, threshold: 0.174115, min_instances: 10.0}
  - name: adwin
    params: {signal: mean_input, name: adwin_input, delta: 0.01}
  - name: kswin
    params: {signal: mean_input, name: kswin_input, alpha: 0.1, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.006618, signal: mean_input, name: ph_input, threshold: 0.026472, min_instances: 5.0}
