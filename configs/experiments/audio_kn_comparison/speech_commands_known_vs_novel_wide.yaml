# Speech Commands v2 Known-vs-Novel — MC-Dropout log-mel CNN, 6.4x wider (capacity control)
#
# S1 known-vs-novel, AUDIO modality. Structurally identical to
# configs/experiments/cifar_kn_comparison/known_vs_novel.yaml so the modality is
# the only thing that changes: 7 known corruptions x 20 batches, then 3 novel
# x 20 batches, novel_start_batch = 140.
#
# Dataset: Speech Commands v0.02 (Warden 2018) — 35 words, 105,829 clips of 1 s @ 16 kHz
# Model:   log-mel CNN (245 K params, 4 conv stages + GAP), dropout p=0.3, trained on the
#          7 known corruptions mixed in per mini-batch at severity 3
#          (30 epochs, SGD + cosine, 25% of batches left clean).
#
# The known/novel split is by *mechanism*, not by strength: the novel three are
# transient clicks, temporal gating and spectral warping — none of which the
# training corruptions (stationary noise, linear filtering, quantisation, room
# reverb) produce. A novel corruption that is merely a stronger version of a
# known one tests nothing.
#
# Severity 3 means SNR = 20 dB for the additive families, the
# AVRobustBench calibration (arXiv:2506.00358).
#
# Detectors: same algorithms, same knobs, three signals — epistemic (ours),
# total entropy (UDD baseline), raw input summary (model-free baseline).
# PageHinkley's threshold is signal-scale dependent and the values below are
# INHERITED FROM THE CIFAR ARMS: sweep before quoting any PH number.
#   python scripts/sweep_detectors.py --config configs/experiments/audio_kn_comparison/speech_commands_known_vs_novel.yaml \
#          --mode known_novel --seeds 7,8,9 --target-far 0.05 --out results/sweeps/audio_sc_mc

experiment: audio_kn_speech_commands_wide
seed: 42
output_dir: ./results/raw

dataset:
  name: audio_known_novel
  params:
    dataset: speech_commands
    split: test
    # KNOWN PHASE IS A LEVEL-MATCHED SUBSET of train_corruptions.
    #
    # band_stop is still in train_corruptions below -- the backbone knows it -- but
    # it is NOT streamed. Reason, measured on the TRAIN split with
    # scripts/probe_corruptions.py (a split no stream draws from, so the choice is
    # not circular): at severity 3 band_stop sits far above the other known
    # corruptions in epistemic level (+0.120 vs +0.006..+0.048 on ESC-50; +0.057 vs
    # +0.004..+0.027 on UrbanSound8K; +0.047 vs -0.002..+0.022 on Speech Commands).
    # Streaming it put a real ~2.5 sigma level step inside the "known" phase, and
    # every change detector fired at its block edges -- correctly, but the run then
    # reported those as known-phase false alarms.
    #
    # Dropping it from the stream makes the known phase approximately stationary,
    # which is what "in-distribution operation" is supposed to mean, and needs no
    # retraining because the model still trained on it.
    #
    # Disclosed limitation: the retained known corruptions are on average EASIER
    # than the novel three, so difficulty and novelty are entangled here as they
    # are in any such design. The primary justification for the known/novel split
    # remains mechanism (transient clicks, temporal gating, spectral warping are
    # not producible by stationary noise, filtering, quantisation or reverb);
    # level-matching is a secondary refinement for legibility.
    known_corruptions:
      - gaussian_noise
      - pink_noise
      - hum_noise
      - lowpass
      - quantization
      - reverb
    novel_corruptions:
      - impulse_noise
      - packet_loss
      - pitch_shift
    n_batches_per_phase: 20
    severity: 3
    batch_size: 64
    seed: 7
    data_root: ./artifacts/audio/speech_commands

model:
  name: audio_cnn_mc_dropout
  params:
    n_samples: 20
    p_drop: 0.3
    # 1.58 M params against the default 247 K (conv stages 64/128/256/512).
    # Third capacity point, so the width control exists on all three datasets
    # rather than only on ESC-50, where it was first run to test whether
    # "total entropy is blind" was an artifact of a 247 K network.
    widths: [64, 128, 256, 512]
    dataset: speech_commands
    data_root: ./artifacts/audio/speech_commands
    ckpt_path: ./artifacts/models/audio_cnn_sc_kn_mc_wide.pt
    train_corruptions:
      - gaussian_noise
      - pink_noise
      - hum_noise
      - lowpass
      - band_stop
      - quantization
      - reverb
    corruption_severity: 3
    clean_fraction: 0.25
    pretrain_epochs: 30
    pretrain_batch_size: 128
    pretrain_lr: 0.05
    pretrain_seed: 0
    seed: 1

uncertainty:
  name: mc_dropout
  params: {}

detectors:
  # -- Supervised (labels; the oracle these unsupervised signals are judged against)
  - name: ddm
    params: {warm_start: 200, drift_threshold: 2.5}

  - name: eddm
    params: {alpha: 0.95, warm_start: 300, beta: 0.9}

  # -- Uncertainty-based (epistemic MI) — ours
  - name: adwin
    params: {signal: mean_epistemic, name: adwin_epistemic, delta: 0.001}

  - name: kswin
    params: {signal: mean_epistemic, name: kswin_epistemic, alpha: 0.05, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.003167, signal: mean_epistemic, name: ph_epistemic, threshold: 0.101346, min_instances: 10.0}

  # -- Total predictive entropy (UDD baseline)
  - name: adwin
    params: {signal: mean_total, name: adwin_total, delta: 0.05}

  - name: kswin
    params: {signal: mean_total, name: kswin_total, alpha: 0.005, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.033106, signal: mean_total, name: ph_total, threshold: 0.264844, min_instances: 10.0}

  # -- Input-based (model-free P(X) drift; same 3 algorithms)
  - name: adwin
    params: {signal: mean_input, name: adwin_input, delta: 0.3}

  - name: kswin
    params: {signal: mean_input, name: kswin_input, alpha: 0.2, window_size: 20, stat_size: 8}

  - name: page_hinkley
    params: {delta: 0.004059, signal: mean_input, name: ph_input, threshold: 0.016235, min_instances: 5.0}
