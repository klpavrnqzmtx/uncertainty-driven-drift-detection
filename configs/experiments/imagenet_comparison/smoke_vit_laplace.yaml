# SMOKE — ImageNet ViT-B/16 MC-Dropout on a synthetic pool (no ImageNet data).
experiment: smoke_imagenet_vit_laplace
seed: 42
output_dir: ./results/raw
dataset:
  name: imagenet_known_novel
  params:
    known_corruptions: [gaussian_noise, brightness]
    novel_corruptions:  [impulse_noise]
    n_batches_per_phase: 1
    severity: 3
    batch_size: 4
    seed: 0
    synthetic: true
    synthetic_pool: 32
    image_size: 224
model:
  name: vit_b16_laplace
  params:
    n_classes: 1000
    dataset: imagenet
    synthetic: true
    image_size: 224
    n_samples: 3
    prior_precision: 1.0
    fit_images: 24
    ckpt_path: ""
    seed: 0
uncertainty:
  name: mc_dropout
  params: {}
detectors:
  - name: ddm
    params: {warm_start: 200, drift_threshold: 2.0}
  - name: page_hinkley
    params: {signal: mean_epistemic, name: ph_epistemic, threshold: 0.05, delta: 0.0125, min_instances: 5.0}
  - name: page_hinkley
    params: {signal: mean_total, name: ph_total, threshold: 0.1, delta: 0.025, min_instances: 5.0}
  - name: page_hinkley
    params: {signal: mean_input, name: ph_input, threshold: 0.1, delta: 0.025, min_instances: 5.0}
