# CIFAR-10 scenario S2 — known-vs-AMBIGUOUS, MC-Dropout ViT
#
# The counterpart to S1 (cifar_kn_comparison/known_vs_novel_vit.yaml). Same backbone, same
# corruption families, same detectors, same 200x64 stream with the boundary at batch 140.
# ONE thing differs: after the boundary the images are BLENDED pairs rather than a novel
# corruption family, so the shift is toward ambiguity the model is familiar with.
#
# Expected — and this is the whole point of the scenario:
#   total entropy  jumps      -> a total-entropy detector (UDD) alarms   [FALSE ALARM]
#   epistemic      stays flat -> the epistemic detector stays quiet      [CORRECT]
# Measured on a 10-epoch mixup fine-tune: total +12.98 sigma, epistemic -0.11 sigma.
#
# mixup_alpha=1.0 is LOAD-BEARING, not regularisation. Without mixup pretraining the blends
# are simply out-of-distribution and epistemic rises with total entropy (+7.96 vs +7.69
# sigma, no separation whatsoever). Mixup is what teaches the model to REPORT ambiguity
# with a spread-but-confident posterior.
#
# The checkpoint is therefore separate from the S1 one and must not be shared.
#
# Accuracy falls in the ambiguous phase. That is correct, not degradation: the added error
# is irreducible, so an alarm here is a false alarm in the actionable sense — retraining
# cannot recover a label the input does not determine.
#
# THRESHOLDS: page_hinkley delta/threshold are inherited from the S1 ViT arm and are NOT
# valid here — the mixup model's known-phase total entropy is ~1.05 rather than ~0.75, a
# different scale entirely. Re-sweep before quoting PH:
#   python scripts/sweep_detectors.py \
#       --config configs/experiments/cifar_ambiguity/known_vs_ambiguous.yaml

experiment: cifar_ambiguity_vit
seed: 42
output_dir: ./results/raw

dataset:
  name: cifar_known_ambiguous
  params:
    known_corruptions:
      - brightness
      - contrast
      - jpeg_compression
      - shot_noise
      - zoom_blur
      - impulse_noise
      - fog
    # Ambiguity ramp: dominant-image weight. 3 phases x 20 batches = 60, mirroring S1's
    # three novel corruptions, with the boundary at batch 140.
    blend_lambdas: [0.7, 0.6, 0.5]
    n_batches_per_phase: 20
    severity: 1
    batch_size: 64
    seed: 7
    data_root: ./artifacts/cifar10

model:
  name: vit_mc_dropout
  params:
    n_samples: 20
    p_drop: 0.1
    dataset_name: cifar10
    data_root: ./artifacts/cifar10
    ckpt_path: ./artifacts/models/vit_cifar_mixup_mc.pt
    patch_size: 4
    dim: 192
    depth: 6
    n_heads: 3
    mlp_ratio: 2.0
    # THE mechanism under test.
    mixup_alpha: 1.0
    train_corruptions:
      - brightness
      - contrast
      - jpeg_compression
      - shot_noise
      - zoom_blur
      - impulse_noise
      - fog
    corruption_severity: 1
    clean_fraction: 0.25
    pretrain_epochs: 200
    pretrain_batch_size: 128
    pretrain_lr: 0.001
    pretrain_weight_decay: 0.05
    pretrain_warmup_epochs: 10
    label_smoothing: 0.1
    pretrain_seed: 0
    seed: 1

uncertainty:
  name: mc_dropout
  params: {}

detectors:
  # ── Supervised ────────────────────────────────────────────────────────────
  - name: ddm
    params: {warm_start: 8000, drift_threshold: 2.0}
  - name: eddm
    params: {alpha: 0.95, warm_start: 300, beta: 0.95}

  # ── Uncertainty-based, EPISTEMIC (ours — should stay quiet) ───────────────
  - name: adwin
    params: {signal: mean_epistemic, name: adwin_epistemic, delta: 0.3}
  - name: kswin
    params: {signal: mean_epistemic, name: kswin_epistemic, alpha: 0.005, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.003273, signal: mean_epistemic, name: ph_epistemic, threshold: 0.052371, min_instances: 10.0}

  # ── Uncertainty-based, TOTAL ENTROPY (UDD — expected to false-alarm) ──────
  # The comparison this scenario exists to make. Same three algorithms, same knobs as the
  # epistemic rows, so any difference is the SIGNAL, not the detector.
  - name: adwin
    params: {signal: mean_total, name: adwin_total, delta: 0.3}
  - name: kswin
    params: {signal: mean_total, name: kswin_total, alpha: 0.005, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.003273, signal: mean_total, name: ph_total, threshold: 0.052371, min_instances: 10.0}

  # ── Input-based (model-free P(X) baseline) ────────────────────────────────
  - name: adwin
    params: {signal: mean_input, name: adwin_input, delta: 0.3}
  - name: kswin
    params: {signal: mean_input, name: kswin_input, alpha: 0.2, window_size: 20, stat_size: 8}
  - name: page_hinkley
    params: {delta: 0.019242, signal: mean_input, name: ph_input, threshold: 0.038484, min_instances: 5.0}
